<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>Please fill out the form below to reach out to us:</p>

        <form action="#" method="post">

            <div>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" placeholder="example@domain.com" required>
            </div>

            <div>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1" max="100" placeholder="e.g. 20">
            </div>

            <div>
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob">
            </div>

            <div>
                <label>Gender:</label><br>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
            </div>

            <div>
                <label>Interests:</label><br>
                <input type="checkbox" id="coding" name="interests" value="coding">
                <label for="coding">Coding</label>
                
                <input type="checkbox" id="sports" name="interests" value="sports">
                <label for="sports">Sports</label>

                <input type="checkbox" id="gaming" name="interests" value="gaming">
                <label for="gaming">Gaming</label>
            </div>

            <div>
                <label for="subject">Subject / Department:</label>
                <select id="subject" name="subject">
                    <option value="">-- Please Select --</option>
                    <option value="general">General Inquiry</option>
                    <option value="support">Technical Support</option>
                    <option value="feedback">Feedback</option>
                </select>
            </div>

            <div>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40" placeholder="Write your message here..."></textarea>
            </div>

            <div>
                <button type="submit">Submit</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 My Website. All rights reserved.</p>
    </footer>

</body>
</html>
